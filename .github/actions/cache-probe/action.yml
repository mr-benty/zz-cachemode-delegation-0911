name: cache-probe
description: tests whether a composite action can save to cache in a restricted job
inputs:
  label:
    description: label for the cache key
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p probe-data
        echo "probe-${{ inputs.label }}-run-${{ github.run_id }}" > probe-data/marker.txt
        echo "PROBE-CREATED: label=${{ inputs.label }} run=${{ github.run_id }}"
    - uses: actions/cache/save@v4
      with:
        path: probe-data
        key: probe-${{ inputs.label }}-${{ github.run_id }}
